extends = ["ruliad-r1.latent-jepa-fixed-ablation.toml"]

[training.events]
continual_backprop_every_steps = 32

[training.continual_backprop]
enabled = true
target = "shared_lowrank_latents"
utility_decay = 0.99
replacement_rate = 0.001
maturity_steps = 1
sample_interval_steps = 8
replace_interval_steps = 32
utility_epsilon = 0.000001
lr_coupling = "none"
lr_coupling_power = 1.0
warmup_steps = 0
cooldown_steps = 0
max_replacements_per_interval = 1
regression_pause_steps = 0
