extends = ["ruliad-r1.adamw-fixed-ablation.toml"]

# NextLat v2 predicts same-pass clean-input targets. Historical corruption arms
# need a separately specified two-view objective, not an implicit target change.
[training.input_corruption]
enabled = false

[model.next_latent_transition]
enabled = true
hidden_multiplier = 2
normalize_input = true
zero_init_output = true

[training.latent_reasoning]
enabled = true
every_steps = 8
jepa_future_offsets = [9999]
target_encoder = "detached_student"
teacher_update_rate = 0.01
negative_source = "in_batch_and_corrupt_answer"

[training.latent_reasoning.next_latent]
enabled = true
horizon = 2
regression_weight = 1.0
token_kl_weight = 0.0
smooth_l1_beta = 1.0
detach_action_embedding = true

[training.latent_reasoning.sigreg]
enabled = false
mode = "weak_covariance"
target_variance = 1.0
min_variance = 0.2
mean_tolerance = 0.05

[training.latent_reasoning.constraint_balancer]
enabled = true
normalized_aux_scale = 0.01
warmup_steps = 512
stop_target_mean_steps = 2.0
stop_tolerance_steps = 0.5
