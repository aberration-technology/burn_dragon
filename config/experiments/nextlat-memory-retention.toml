version = 1
output = "target/experiments/nextlat-memory-retention-clock-v2"
repositories = [".", "../burn_pc", "../burn_ecs", "../burn_eggroll", "../burn_p2p"]

[limits]
system_fraction = 0.90
headroom_mib = 4096
poll_seconds = 0.25
gpu_sample_seconds = 2.0
shared_gpu_memory = true

[[cases]]
id = "reference-d0-then-d0-d1"
gpu = true
expected_peak_mib = 32768
timeout_seconds = 5400
argv = ["target/release/examples/train_language", "--backend", "cuda", "--config", "config/language/experiments/next_latent/memory-retention.toml"]
inputs = ["config/language/experiments/next_latent/base.toml", "config/language/experiments/next_latent/corpus.toml", "config/language/experiments/next_latent/in-distribution.corpus.toml", "config/language/experiments/next_latent/credit-base.toml", "config/language/experiments/next_latent/capacity-base.toml", "config/language/experiments/next_latent/conditional-answer.overlay.toml", "config/language/experiments/next_latent/alibi-reference.overlay.toml", "config/language/experiments/next_latent/memory-long.overlay.toml", "config/language/experiments/next_latent/memory-retention.toml", "config/language/experiments/next_latent/memory-retention.corpus.toml"]

[[cases]]
id = "reference-stationary-d0"
gpu = true
expected_peak_mib = 32768
timeout_seconds = 5400
argv = ["target/release/examples/train_language", "--backend", "cuda", "--config", "config/language/experiments/next_latent/memory-retention.toml", "--config", "config/language/experiments/next_latent/memory-stationary.overlay.toml"]
inputs = ["config/language/experiments/next_latent/base.toml", "config/language/experiments/next_latent/corpus.toml", "config/language/experiments/next_latent/in-distribution.corpus.toml", "config/language/experiments/next_latent/credit-base.toml", "config/language/experiments/next_latent/capacity-base.toml", "config/language/experiments/next_latent/conditional-answer.overlay.toml", "config/language/experiments/next_latent/alibi-reference.overlay.toml", "config/language/experiments/next_latent/memory-long.overlay.toml", "config/language/experiments/next_latent/memory-retention.toml", "config/language/experiments/next_latent/memory-retention.corpus.toml", "config/language/experiments/next_latent/memory-stationary.corpus.toml", "config/language/experiments/next_latent/memory-stationary.overlay.toml"]
