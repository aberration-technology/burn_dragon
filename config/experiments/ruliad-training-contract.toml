argv = ["target/release/examples/train_language", "--backend", "cuda", "--config", "config/language/experiments/predictive_coding/evaluation-contract-pilot-adamw.toml", "--config", "config/language/experiments/predictive_coding/evaluation-contract-no-stream.overlay.toml"]
inputs = ["config/language/experiments/predictive_coding/evaluation-contract-pilot-adamw.toml", "config/language/experiments/predictive_coding/evaluation-contract-pilot.toml", "config/language/experiments/predictive_coding/evaluation-contract-no-stream.overlay.toml", "crates/burn_dragon_p2p/deploy/profiles/ruliad-r3.semantic-action.corpus.toml"]

