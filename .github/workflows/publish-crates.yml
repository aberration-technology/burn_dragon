name: Publish Crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run cargo publish as a dry-run instead of publishing to crates.io
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-crates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap locked sibling stack
        uses: ./.github/actions/bootstrap-stack
        with:
          token: ${{ secrets.BURN_STACK_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: publish crates in dependency order
        run: cargo run -p xtask -- publish-crates --dry-run "${{ github.event.inputs.dry_run }}"
