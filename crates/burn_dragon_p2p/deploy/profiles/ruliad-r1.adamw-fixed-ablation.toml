extends = ["ruliad-r1.training.toml"]

[model]
n_layer = 2
n_embd = 64
n_head = 4
latent_total = 256
dropout = 0.05

[training]
block_size = 64
max_iters = 64
checkpoint_interval_iters = 64
log_frequency = 8
batch_size = 4

[training.auto_batch_size]
enabled = false

[training.continual_backprop]
enabled = false

[training.neuron_scaling]
enabled = false

[training.dynamics]
enabled = false

[optimizer]
name = "adamw"
learning_rate = 0.001
weight_decay = 0.0
