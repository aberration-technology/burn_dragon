extends = "local-pc-verifier-1m-answer-completion.toml"

# Three disjoint primary contracts over a four-step cycle:
#   0: verifier-native legal-action selection
#   1,3: prompt + supplied schema -> field value
#   2: complete causal answer rendering
[training.ruliad_supervision.prompt_value_binding]
enabled = true
every_steps = 2
phase_steps = 1
start_after_steps = 0
max_completion_tokens = 64
max_rows_per_step = 32
