# One-step error-coordinate PC candidate. The precision/step product of one
# gives a backprop-aligned first error wave while model-parameter derivatives
# remain factor-local on the plain backend.
[training.local_predictive_coding]
solver = "error_equilibrium"
parameterization = "standard"
prediction_precision = 10.0

[training.local_predictive_coding.inference]
steps = 1
step_size = 0.1
max_grad_norm = 1000000.0
