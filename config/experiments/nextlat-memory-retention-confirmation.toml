version = 1
output = "target/experiments/nextlat-memory-retention-confirmation"
repositories = [".", "../burn_pc", "../burn_ecs", "../burn_eggroll", "../burn_p2p"]

[limits]
system_fraction = 0.90
headroom_mib = 4096
poll_seconds = 0.25
gpu_sample_seconds = 2.0
shared_gpu_memory = true

[[cases]]
id = "curriculum-epoch16-same-grammar"
gpu = true
expected_peak_mib = 32768
timeout_seconds = 1200
argv = ["target/release/examples/evaluate_ruliad_checkpoint","--backend","cuda","--checkpoint","target/experiments/nextlat-memory-retention-boundary/gullible-vest","--epoch","16","--evaluation-corpus","config/language/experiments/next_latent/retention-confirmatory-same-grammar.corpus.toml","--free-run-items","512","--policy-items","16","--difficulty-levels","2","--panel-seed","9173403","--batch-size","2","--no-closed-loop-rollout","--output","{output}/evaluation.json"]
inputs = ["config/language/experiments/next_latent/corpus.toml","config/language/experiments/next_latent/in-distribution.corpus.toml","config/language/experiments/next_latent/structural-eval.corpus.toml","config/language/experiments/next_latent/memory-retention.corpus.toml","config/language/experiments/next_latent/memory-stationary.corpus.toml","config/language/experiments/next_latent/retention-confirmatory-same-grammar.corpus.toml","target/experiments/nextlat-memory-retention-boundary/gullible-vest/training_config.json","target/experiments/nextlat-memory-retention-boundary/gullible-vest/config.json","target/experiments/nextlat-memory-retention-boundary/gullible-vest/checkpoint/model-config-16.json","target/experiments/nextlat-memory-retention-boundary/gullible-vest/checkpoint/model-16.bin","target/experiments/nextlat-memory-retention-boundary/gullible-vest/input-copy.json"]

