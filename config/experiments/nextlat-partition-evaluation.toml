version = 1
output = "target/experiments/nextlat-partition-evaluation"
repositories = [".", "../burn_pc", "../burn_ecs", "../burn_eggroll", "../burn_p2p"]

[limits]
system_fraction = 0.90
headroom_mib = 4096
poll_seconds = 0.25
gpu_sample_seconds = 2.0
shared_gpu_memory = true

[[cases]]
id = "ce-training-grammar"
gpu = true
expected_peak_mib = 32768
timeout_seconds = 900
argv = ["target/release/examples/evaluate_ruliad_checkpoint", "--backend", "cuda", "--checkpoint", "runs/bumpy-brake", "--epoch", "4", "--evaluation-corpus", "config/language/experiments/next_latent/in-distribution.corpus.toml", "--free-run-items", "64", "--policy-items", "16", "--difficulty-levels", "1", "--panel-seed", "91733", "--batch-size", "2", "--no-closed-loop-rollout", "--output", "{output}/evaluation.json"]
inputs = ["config/language/experiments/next_latent/corpus.toml", "config/language/experiments/next_latent/in-distribution.corpus.toml", "runs/bumpy-brake/training_config.json", "runs/bumpy-brake/config.json", "runs/bumpy-brake/checkpoint/model-config-4.json", "runs/bumpy-brake/checkpoint/model-4.bin"]

