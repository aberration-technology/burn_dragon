argv = ["target/release/examples/train_language", "--backend", "cuda", "--config", "config/language/experiments/next_latent/base.toml", "--config", "config/language/experiments/next_latent/h2.overlay.toml", "--config", "config/language/experiments/next_latent/throughput.overlay.toml", "--batch-size", "32"]
inputs = ["config/language/experiments/next_latent/base.toml", "config/language/experiments/next_latent/corpus.toml", "config/language/experiments/next_latent/h2.overlay.toml", "config/language/experiments/next_latent/throughput.overlay.toml"]
