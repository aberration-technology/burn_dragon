# Depth-transfer research control. This is intentionally separate from the
# standard ePC candidate because repeated shared-weight uses need an empirical
# reduction contract beyond the independent-layer muPC derivation.
[training.local_predictive_coding]
solver = "error_equilibrium"
parameterization = "mu_pc"
shared_reuse_reduction = "root_mean_square"
prediction_precision = 10.0

[training.local_predictive_coding.inference]
steps = 1
step_size = 0.1
max_grad_norm = 1000000.0
