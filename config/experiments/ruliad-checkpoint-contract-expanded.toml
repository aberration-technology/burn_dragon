# Expanded fixed-panel audit of the same paired epoch-8 checkpoints.
version = 1
output = "target/experiments/ruliad-checkpoint-contract-expanded-v2"
repositories = [".", "../burn_pc", "../burn_ecs", "../burn_eggroll", "../burn_p2p"]

[limits]
system_fraction = 0.90
headroom_mib = 4096
poll_seconds = 0.25
gpu_sample_seconds = 2.0
shared_gpu_memory = true

[[cases]]
id = "adamw-panel73"
gpu = true
expected_peak_mib = 16384
timeout_seconds = 600
argv = ["target/release/examples/evaluate_ruliad_checkpoint", "--backend", "cuda", "--checkpoint", "target/experiment-inputs/evaluation-contract/adamw", "--epoch", "8", "--panel-seed", "73", "--free-run-items", "256", "--policy-items", "256", "--difficulty-levels", "4", "--batch-size", "2", "--no-closed-loop-rollout", "--output", "{output}/adamw-seed13.json"]
inputs = ["target/experiment-inputs/evaluation-contract/adamw/checkpoint/model-8.bin", "target/experiment-inputs/evaluation-contract/adamw/training_config.json", "target/experiment-inputs/evaluation-contract/adamw/config.json", "crates/burn_dragon_p2p/deploy/profiles/ruliad-r3.semantic-action.corpus.toml"]

[[cases]]
id = "pc-panel73"
gpu = true
expected_peak_mib = 16384
timeout_seconds = 600
argv = ["target/release/examples/evaluate_ruliad_checkpoint", "--backend", "cuda", "--checkpoint", "target/experiment-inputs/evaluation-contract/pc", "--epoch", "8", "--panel-seed", "73", "--free-run-items", "256", "--policy-items", "256", "--difficulty-levels", "4", "--batch-size", "2", "--no-closed-loop-rollout", "--output", "{output}/pc-seed13.json"]
inputs = ["target/experiment-inputs/evaluation-contract/pc/checkpoint/model-8.bin", "target/experiment-inputs/evaluation-contract/pc/training_config.json", "target/experiment-inputs/evaluation-contract/pc/config.json", "crates/burn_dragon_p2p/deploy/profiles/ruliad-r3.semantic-action.corpus.toml"]
