# Stage the four completed epoch-4 pilot run directories under this input root.
version = 1
output = "target/experiments/ruliad-maintenance-checkpoints"
repositories = [".", "../burn_pc", "../burn_ecs", "../burn_eggroll", "../burn_p2p"]

[limits]
system_fraction = 0.90
headroom_mib = 4096
poll_seconds = 0.25
gpu_sample_seconds = 2.0
shared_gpu_memory = true

[[cases]]
id = "adamw-carry"
gpu = true
expected_peak_mib = 16384
timeout_seconds = 180
argv = ["target/release/examples/evaluate_ruliad_checkpoint", "--backend", "cuda", "--checkpoint", "target/experiment-inputs/maintenance/adamw-carry", "--epoch", "4", "--panel-seed", "75", "--free-run-items", "16", "--policy-items", "16", "--difficulty-levels", "4", "--batch-size", "2", "--no-closed-loop-rollout", "--output", "{output}/adamw-carry-seed13.json"]
inputs = ["target/experiment-inputs/maintenance/adamw-carry/checkpoint/model-4.bin", "target/experiment-inputs/maintenance/adamw-carry/checkpoint/model-config-4.json", "target/experiment-inputs/maintenance/adamw-carry/training_config.json", "target/experiment-inputs/maintenance/adamw-carry/config.json", "crates/burn_dragon_p2p/deploy/profiles/ruliad-r3.semantic-action.corpus.toml"]

[[cases]]
id = "pc-carry"
gpu = true
expected_peak_mib = 16384
timeout_seconds = 180
argv = ["target/release/examples/evaluate_ruliad_checkpoint", "--backend", "cuda", "--checkpoint", "target/experiment-inputs/maintenance/pc-carry", "--epoch", "4", "--panel-seed", "75", "--free-run-items", "16", "--policy-items", "16", "--difficulty-levels", "4", "--batch-size", "2", "--no-closed-loop-rollout", "--output", "{output}/pc-carry-seed13.json"]
inputs = ["target/experiment-inputs/maintenance/pc-carry/checkpoint/model-4.bin", "target/experiment-inputs/maintenance/pc-carry/checkpoint/model-config-4.json", "target/experiment-inputs/maintenance/pc-carry/training_config.json", "target/experiment-inputs/maintenance/pc-carry/config.json", "crates/burn_dragon_p2p/deploy/profiles/ruliad-r3.semantic-action.corpus.toml"]

[[cases]]
id = "adamw-no-maintenance"
gpu = true
expected_peak_mib = 16384
timeout_seconds = 180
argv = ["target/release/examples/evaluate_ruliad_checkpoint", "--backend", "cuda", "--checkpoint", "target/experiment-inputs/maintenance/adamw-no-maintenance", "--epoch", "4", "--panel-seed", "75", "--free-run-items", "16", "--policy-items", "16", "--difficulty-levels", "4", "--batch-size", "2", "--no-closed-loop-rollout", "--output", "{output}/adamw-no-maintenance-seed13.json"]
inputs = ["target/experiment-inputs/maintenance/adamw-no-maintenance/checkpoint/model-4.bin", "target/experiment-inputs/maintenance/adamw-no-maintenance/checkpoint/model-config-4.json", "target/experiment-inputs/maintenance/adamw-no-maintenance/training_config.json", "target/experiment-inputs/maintenance/adamw-no-maintenance/config.json", "crates/burn_dragon_p2p/deploy/profiles/ruliad-r3.semantic-action.corpus.toml"]

[[cases]]
id = "pc-no-maintenance"
gpu = true
expected_peak_mib = 16384
timeout_seconds = 180
argv = ["target/release/examples/evaluate_ruliad_checkpoint", "--backend", "cuda", "--checkpoint", "target/experiment-inputs/maintenance/pc-no-maintenance", "--epoch", "4", "--panel-seed", "75", "--free-run-items", "16", "--policy-items", "16", "--difficulty-levels", "4", "--batch-size", "2", "--no-closed-loop-rollout", "--output", "{output}/pc-no-maintenance-seed13.json"]
inputs = ["target/experiment-inputs/maintenance/pc-no-maintenance/checkpoint/model-4.bin", "target/experiment-inputs/maintenance/pc-no-maintenance/checkpoint/model-config-4.json", "target/experiment-inputs/maintenance/pc-no-maintenance/training_config.json", "target/experiment-inputs/maintenance/pc-no-maintenance/config.json", "crates/burn_dragon_p2p/deploy/profiles/ruliad-r3.semantic-action.corpus.toml"]
