version = 1
output = "target/experiments/nextlat-memory-mastery-confirmation"
repositories = [".", "../burn_pc", "../burn_ecs", "../burn_eggroll", "../burn_p2p"]

[limits]
system_fraction = 0.90
headroom_mib = 4096
poll_seconds = 0.25
gpu_sample_seconds = 2.0
shared_gpu_memory = true

[[cases]]
id = "before-same-grammar-d0-d1"
gpu = true
expected_peak_mib = 32768
timeout_seconds = 1200
argv = ["target/release/examples/evaluate_ruliad_checkpoint","--backend","cuda","--checkpoint","runs/terrific-friend","--epoch","32","--evaluation-corpus","config/language/experiments/next_latent/mastery-confirmatory-same-grammar.corpus.toml","--free-run-items","512","--policy-items","16","--difficulty-levels","2","--panel-seed","9173404","--batch-size","2","--no-closed-loop-rollout","--output","{output}/evaluation.json"]
