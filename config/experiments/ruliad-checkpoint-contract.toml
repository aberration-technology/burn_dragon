# Run from the workspace root with python3 -m scripts.experiments <this file>.
# Stage paired epoch-8 runs at target/experiment-inputs/evaluation-contract/{adamw,pc}.
# These are evaluation panel seeds, NOT independent model-training seeds.
version = 1
output = "target/experiments/ruliad-checkpoint-contract"
repositories = [".", "../burn_pc", "../burn_ecs", "../burn_eggroll", "../burn_p2p"]

[limits]
system_fraction = 0.90
headroom_mib = 4096
poll_seconds = 0.25
gpu_sample_seconds = 2.0
shared_gpu_memory = true
gpu_index = 0

[[cases]]
id = "adamw-panel71"
gpu = true
expected_peak_mib = 16384
timeout_seconds = 300
argv = ["target/release/examples/evaluate_ruliad_checkpoint", "--backend", "cuda", "--checkpoint", "target/experiment-inputs/evaluation-contract/adamw", "--epoch", "8", "--panel-seed", "71", "--free-run-items", "16", "--policy-items", "16", "--difficulty-levels", "4", "--batch-size", "2", "--no-closed-loop-rollout", "--output", "{output}/adamw-seed13.json"]
inputs = ["target/experiment-inputs/evaluation-contract/adamw/checkpoint/model-8.bin", "target/experiment-inputs/evaluation-contract/adamw/training_config.json", "target/experiment-inputs/evaluation-contract/adamw/config.json", "crates/burn_dragon_p2p/deploy/profiles/ruliad-r3.semantic-action.corpus.toml"]

[[cases]]
id = "pc-panel71"
gpu = true
expected_peak_mib = 16384
timeout_seconds = 300
argv = ["target/release/examples/evaluate_ruliad_checkpoint", "--backend", "cuda", "--checkpoint", "target/experiment-inputs/evaluation-contract/pc", "--epoch", "8", "--panel-seed", "71", "--free-run-items", "16", "--policy-items", "16", "--difficulty-levels", "4", "--batch-size", "2", "--no-closed-loop-rollout", "--output", "{output}/pc-seed13.json"]
inputs = ["target/experiment-inputs/evaluation-contract/pc/checkpoint/model-8.bin", "target/experiment-inputs/evaluation-contract/pc/training_config.json", "target/experiment-inputs/evaluation-contract/pc/config.json", "crates/burn_dragon_p2p/deploy/profiles/ruliad-r3.semantic-action.corpus.toml"]

[[cases]]
id = "adamw-panel72"
gpu = true
expected_peak_mib = 16384
timeout_seconds = 300
argv = ["target/release/examples/evaluate_ruliad_checkpoint", "--backend", "cuda", "--checkpoint", "target/experiment-inputs/evaluation-contract/adamw", "--epoch", "8", "--panel-seed", "72", "--free-run-items", "16", "--policy-items", "16", "--difficulty-levels", "4", "--batch-size", "2", "--no-closed-loop-rollout", "--output", "{output}/adamw-seed13.json"]
inputs = ["target/experiment-inputs/evaluation-contract/adamw/checkpoint/model-8.bin", "target/experiment-inputs/evaluation-contract/adamw/training_config.json", "target/experiment-inputs/evaluation-contract/adamw/config.json", "crates/burn_dragon_p2p/deploy/profiles/ruliad-r3.semantic-action.corpus.toml"]

[[cases]]
id = "pc-panel72"
gpu = true
expected_peak_mib = 16384
timeout_seconds = 300
argv = ["target/release/examples/evaluate_ruliad_checkpoint", "--backend", "cuda", "--checkpoint", "target/experiment-inputs/evaluation-contract/pc", "--epoch", "8", "--panel-seed", "72", "--free-run-items", "16", "--policy-items", "16", "--difficulty-levels", "4", "--batch-size", "2", "--no-closed-loop-rollout", "--output", "{output}/pc-seed13.json"]
inputs = ["target/experiment-inputs/evaluation-contract/pc/checkpoint/model-8.bin", "target/experiment-inputs/evaluation-contract/pc/training_config.json", "target/experiment-inputs/evaluation-contract/pc/config.json", "crates/burn_dragon_p2p/deploy/profiles/ruliad-r3.semantic-action.corpus.toml"]
