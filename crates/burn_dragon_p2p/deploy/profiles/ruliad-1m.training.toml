[dataset]
cache_dir = "./cache/ruliad-1m"
train_split_ratio = 0.8
type = "universality_ruliad"
config = "crates/burn_dragon_p2p/deploy/profiles/ruliad-1m.corpus.toml"

[dataset.tokenizer]
type = "pretokenized"
vocab_size = 272
eos_id = 271

[model]
n_layer = 4
n_embd = 128
n_head = 4
latent_total = 512
dropout = 0.0

[model.language_head]
type = "standard_token_classification"

[training]
block_size = 256
batch_size = 16
max_iters = 4096
checkpoint_interval_iters = 512
log_frequency = 16
seed = 1337

[training.ruliad_supervision]
mode = "answer_completion"

[training.events]
flush_every_steps = 8
source_selection_every_steps = 16
source_weighted_validation_batches = 1
degeneracy_probe_every_epochs = 1
degeneracy_probe_tokens = 32
ruliad_correctness_probe_every_epochs = 1
ruliad_correctness_probe_items = 32
ruliad_correctness_probe_tokens = 64

[training.gates]
plateau_patience_epochs = 8
validation_regression_patience_epochs = 1
# Alert before live source selection collapses to a small handful of buckets.
# Healthy ruliad-1m runs currently sit around 6.4-6.5 bits after startup focus.
source_entropy_min_bits = 4.0
source_learning_progress_min = 0.001
source_hash_noise_max_probability = 0.0
degeneracy_patience = 1
degeneracy_entropy_min_bits = 1.0

[optimizer]
name = "adamw"
learning_rate = 0.001
weight_decay = 0.01

[generation]
prompt = ""
