version = 1
output = "target/experiments/nextlat-answer-supervision-learning"
repositories = [".", "../burn_pc", "../burn_ecs", "../burn_eggroll", "../burn_p2p"]

[limits]
system_fraction = 0.90
headroom_mib = 4096
poll_seconds = 0.25
gpu_sample_seconds = 2.0
shared_gpu_memory = true

# Batch 32 passed training, evaluation, and checkpoint smokes at 21.94 GiB.
# The admission estimate is additional residency, not an allocation target.
[[cases]]
id = "joint-ce"
gpu = true
expected_peak_mib = 65536
timeout_seconds = 5400
argv = ["target/release/examples/train_language", "--backend", "cuda", "--config", "config/language/experiments/next_latent/capacity-base.toml", "--batch-size", "32", "--max-iters", "4096", "--checkpoint-interval-iters", "1024"]
inputs = ["config/language/experiments/next_latent/base.toml", "config/language/experiments/next_latent/corpus.toml", "config/language/experiments/next_latent/in-distribution.corpus.toml", "config/language/experiments/next_latent/credit-base.toml", "config/language/experiments/next_latent/capacity-base.toml"]

[[cases]]
id = "conditional-ce"
gpu = true
expected_peak_mib = 65536
timeout_seconds = 5400
argv = ["target/release/examples/train_language", "--backend", "cuda", "--config", "config/language/experiments/next_latent/capacity-base.toml", "--config", "config/language/experiments/next_latent/conditional-answer.overlay.toml", "--batch-size", "32", "--max-iters", "4096", "--checkpoint-interval-iters", "1024"]
inputs = ["config/language/experiments/next_latent/base.toml", "config/language/experiments/next_latent/corpus.toml", "config/language/experiments/next_latent/in-distribution.corpus.toml", "config/language/experiments/next_latent/credit-base.toml", "config/language/experiments/next_latent/capacity-base.toml", "config/language/experiments/next_latent/conditional-answer.overlay.toml"]
