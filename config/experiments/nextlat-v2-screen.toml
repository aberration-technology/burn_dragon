version = 1
output = "target/experiments/nextlat-v2-screen"
repositories = [".", "../burn_pc", "../burn_ecs", "../burn_eggroll", "../burn_p2p"]

[limits]
system_fraction = 0.90
headroom_mib = 4096
poll_seconds = 0.25
gpu_sample_seconds = 2.0
shared_gpu_memory = true

[[cases]]
id = "ce-b4-seed13"
gpu = true
expected_peak_mib = 32768
timeout_seconds = 900
argv = ["target/release/examples/train_language", "--backend", "cuda", "--config", "config/language/experiments/next_latent/base.toml", "--batch-size", "4", "--max-iters", "256", "--checkpoint-interval-iters", "256"]
inputs = ["config/language/experiments/next_latent/base.toml", "config/language/experiments/next_latent/corpus.toml"]

