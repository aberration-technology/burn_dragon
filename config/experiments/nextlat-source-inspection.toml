version = 1
output = "target/experiments/nextlat-source-inspection"
repositories = [".", "../burn_pc", "../burn_ecs", "../burn_eggroll", "../burn_p2p"]

[limits]
system_fraction = 0.90
headroom_mib = 4096
poll_seconds = 0.25
shared_gpu_memory = true

[[cases]]
id = "training"
gpu = false
expected_peak_mib = 1024
timeout_seconds = 60
argv = ["target/release/bd-ruliad", "inspect-samples", "--config", "config/language/experiments/next_latent/corpus.toml", "--split", "train", "--levels", "0", "--samples-per-bucket", "64", "--out", "{output}/samples.json"]
inputs = ["config/language/experiments/next_latent/corpus.toml"]

[[cases]]
id = "same-grammar-validation"
gpu = false
expected_peak_mib = 1024
timeout_seconds = 60
argv = ["target/release/bd-ruliad", "inspect-samples", "--config", "config/language/experiments/next_latent/in-distribution.corpus.toml", "--split", "validation", "--levels", "0", "--samples-per-bucket", "64", "--out", "{output}/samples.json"]
inputs = ["config/language/experiments/next_latent/corpus.toml", "config/language/experiments/next_latent/in-distribution.corpus.toml"]

[[cases]]
id = "structural-validation"
gpu = false
expected_peak_mib = 1024
timeout_seconds = 60
argv = ["target/release/bd-ruliad", "inspect-samples", "--config", "config/language/experiments/next_latent/structural-eval.corpus.toml", "--split", "validation", "--levels", "0", "--samples-per-bucket", "64", "--out", "{output}/samples.json"]
inputs = ["config/language/experiments/next_latent/corpus.toml", "config/language/experiments/next_latent/structural-eval.corpus.toml"]
