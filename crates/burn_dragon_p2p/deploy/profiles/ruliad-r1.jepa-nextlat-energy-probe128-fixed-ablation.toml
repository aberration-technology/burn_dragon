extends = ["ruliad-r1.jepa-nextlat-decoupled-delayed1024-sparse16-probe128-fixed-ablation.toml"]

[model.latent_reasoning]
enabled = true
max_steps = 2
min_steps = 2
adaptive_halting = false
halt_threshold = 0.55
refiner_hidden_multiplier = 1
normalize_steps = false
energy_head = true
stop_bias_init = -2.0
energy_margin = 1.0

[training.latent_reasoning]
eval_step_sweep = [1, 2, 4, 8]

[training.latent_reasoning.energy_model]
enabled = true
every_steps = 16
start_after_steps = 1024
contrastive_weight = 1.0
monotonic_weight = 0.25
contractive_weight = 0.05
margin = 1.0
monotonic_tolerance = 0.0
trust_radius = 1.0
max_rollout_steps_for_loss = 4
