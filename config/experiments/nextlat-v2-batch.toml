version = 1
output = "target/experiments/nextlat-v2-batch"
repositories = [".", "../burn_pc", "../burn_ecs", "../burn_eggroll", "../burn_p2p"]

[limits]
system_fraction = 0.90
headroom_mib = 4096
poll_seconds = 0.25
gpu_sample_seconds = 2.0
shared_gpu_memory = true

[[cases]]
id = "h2-b8"
gpu = true
expected_peak_mib = 32768
timeout_seconds = 300
argv = ["target/release/examples/train_language", "--backend", "cuda", "--config", "config/language/experiments/next_latent/base.toml", "--config", "config/language/experiments/next_latent/h2.overlay.toml", "--config", "config/language/experiments/next_latent/throughput.overlay.toml", "--batch-size", "8"]
inputs = ["config/language/experiments/next_latent/base.toml", "config/language/experiments/next_latent/corpus.toml", "config/language/experiments/next_latent/h2.overlay.toml", "config/language/experiments/next_latent/throughput.overlay.toml"]

[[cases]]
id = "h2-b16"
gpu = true
expected_peak_mib = 49152
timeout_seconds = 300
argv = ["target/release/examples/train_language", "--backend", "cuda", "--config", "config/language/experiments/next_latent/base.toml", "--config", "config/language/experiments/next_latent/h2.overlay.toml", "--config", "config/language/experiments/next_latent/throughput.overlay.toml", "--batch-size", "16"]
inputs = ["config/language/experiments/next_latent/base.toml", "config/language/experiments/next_latent/corpus.toml", "config/language/experiments/next_latent/h2.overlay.toml", "config/language/experiments/next_latent/throughput.overlay.toml"]

[[cases]]
