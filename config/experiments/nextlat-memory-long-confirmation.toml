version = 1
output = "target/experiments/nextlat-memory-long-confirmation"
repositories = [".", "../burn_pc", "../burn_ecs", "../burn_eggroll", "../burn_p2p"]

[limits]
system_fraction = 0.90
headroom_mib = 4096
poll_seconds = 0.25
gpu_sample_seconds = 2.0
shared_gpu_memory = true

[[cases]]
id = "fast-decay-same-grammar"
gpu = true
expected_peak_mib = 32768
timeout_seconds = 900
argv = ["target/release/examples/evaluate_ruliad_checkpoint", "--backend", "cuda", "--checkpoint", "runs/puffy-trick", "--epoch", "16", "--evaluation-corpus", "config/language/experiments/next_latent/long-confirmatory-same-grammar.corpus.toml", "--free-run-items", "256", "--policy-items", "16", "--difficulty-levels", "1", "--panel-seed", "9173402", "--batch-size", "2", "--no-closed-loop-rollout", "--output", "{output}/evaluation.json"]
inputs = ["config/language/experiments/next_latent/corpus.toml", "config/language/experiments/next_latent/in-distribution.corpus.toml", "config/language/experiments/next_latent/long-confirmatory-same-grammar.corpus.toml", "runs/puffy-trick/training_config.json", "runs/puffy-trick/config.json", "runs/puffy-trick/checkpoint/model-config-16.json", "runs/puffy-trick/checkpoint/model-16.bin"]

[[cases]]
id = "reference-decay-same-grammar"
gpu = true
expected_peak_mib = 32768
timeout_seconds = 900
argv = ["target/release/examples/evaluate_ruliad_checkpoint", "--backend", "cuda", "--checkpoint", "runs/erratic-field", "--epoch", "16", "--evaluation-corpus", "config/language/experiments/next_latent/long-confirmatory-same-grammar.corpus.toml", "--free-run-items", "256", "--policy-items", "16", "--difficulty-levels", "1", "--panel-seed", "9173402", "--batch-size", "2", "--no-closed-loop-rollout", "--output", "{output}/evaluation.json"]
