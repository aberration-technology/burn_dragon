version = 1
output = "target/experiments/nextlat-memory-mastery-continuation"
repositories = [".", "../burn_pc", "../burn_ecs", "../burn_eggroll", "../burn_p2p"]

[limits]
system_fraction = 0.90
headroom_mib = 4096
poll_seconds = 0.25
gpu_sample_seconds = 2.0
shared_gpu_memory = true

[[cases]]
id = "reference-mastery-first-continuation"
gpu = true
expected_peak_mib = 32768
timeout_seconds = 3600
argv = ["target/release/examples/train_language", "--backend", "cuda", "--config", "config/language/experiments/next_latent/memory-retention.toml", "--config", "config/language/experiments/next_latent/memory-stationary.overlay.toml", "--config", "config/language/experiments/next_latent/memory-mastery-continuation.overlay.toml"]
