version = 1
output = "target/experiments/nextlat-memory-timescale-confirmation"
repositories = [".", "../burn_pc", "../burn_ecs", "../burn_eggroll", "../burn_p2p"]

[limits]
system_fraction = 0.90
headroom_mib = 4096
poll_seconds = 0.25
gpu_sample_seconds = 2.0
shared_gpu_memory = true

[[cases]]
id = "fast-decay-same-grammar"
gpu = true
expected_peak_mib = 32768
timeout_seconds = 900
argv = ["target/release/examples/evaluate_ruliad_checkpoint", "--backend", "cuda", "--checkpoint", "runs/nappy-face", "--epoch", "4", "--evaluation-corpus", "config/language/experiments/next_latent/confirmatory-same-grammar.corpus.toml", "--free-run-items", "256", "--policy-items", "16", "--difficulty-levels", "1", "--panel-seed", "9173401", "--batch-size", "2", "--no-closed-loop-rollout", "--output", "{output}/evaluation.json"]
inputs = ["config/language/experiments/next_latent/corpus.toml", "config/language/experiments/next_latent/in-distribution.corpus.toml", "config/language/experiments/next_latent/confirmatory-same-grammar.corpus.toml", "runs/nappy-face/training_config.json", "runs/nappy-face/config.json", "runs/nappy-face/checkpoint/model-config-4.json", "runs/nappy-face/checkpoint/model-4.bin"]

[[cases]]
id = "reference-decay-same-grammar"
gpu = true
expected_peak_mib = 32768
timeout_seconds = 900
argv = ["target/release/examples/evaluate_ruliad_checkpoint", "--backend", "cuda", "--checkpoint", "runs/sad-stem", "--epoch", "4", "--evaluation-corpus", "config/language/experiments/next_latent/confirmatory-same-grammar.corpus.toml", "--free-run-items", "256", "--policy-items", "16", "--difficulty-levels", "1", "--panel-seed", "9173401", "--batch-size", "2", "--no-closed-loop-rollout", "--output", "{output}/evaluation.json"]
inputs = ["config/language/experiments/next_latent/corpus.toml", "config/language/experiments/next_latent/in-distribution.corpus.toml", "config/language/experiments/next_latent/confirmatory-same-grammar.corpus.toml", "runs/sad-stem/training_config.json", "runs/sad-stem/config.json", "runs/sad-stem/checkpoint/model-config-4.json", "runs/sad-stem/checkpoint/model-4.bin"]

